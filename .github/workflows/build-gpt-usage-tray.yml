name: Build GPT Usage Tray

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/gpt-usage-tray/**"
      - "build.ps1"
      - ".github/workflows/build-gpt-usage-tray.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Package
        shell: powershell
        run: Compress-Archive -LiteralPath 'dist\GPT Usage Tray' -DestinationPath 'GPT-Usage-Tray-v1.0.0.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Usage-Tray-v1.0.0
          path: GPT-Usage-Tray-v1.0.0.zip
