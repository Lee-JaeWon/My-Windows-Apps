<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 260" role="img" aria-labelledby="title description">
  <title id="title">GPT Usage Tray 작업 표시줄 예시</title>
  <desc id="description">작업 표시줄 맨 왼쪽에 가상의 주간 잔여량 GPT 65, Claude 15(20% 미만이라 빨간색), Gemini 100을 색 점·숫자·밑줄로 표시한 모습</desc>
  <defs>
    <linearGradient id="desktop" x2="1" y2="1">
      <stop stop-color="#cbd9e6"/>
      <stop offset="1" stop-color="#aebed4"/>
    </linearGradient>
    <linearGradient id="taskbar" x2="0" y2="1">
      <stop stop-color="#f7f9fb" stop-opacity=".96"/>
      <stop offset="1" stop-color="#e9edf2" stop-opacity=".98"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.3" width="1.4" height="1.6">
      <feDropShadow dx="0" dy="-5" stdDeviation="11" flood-color="#506077" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1110" height="260" fill="url(#desktop)"/>
  <path d="M665 0h445v155H340Z" fill="#edf3f8" opacity=".19"/>
  <path d="M0 88h380l210 92H0Z" fill="#7c9abb" opacity=".13"/>
  <rect y="160" width="1110" height="100" fill="url(#taskbar)" filter="url(#shadow)"/>
  <path d="M0 160h1110" stroke="#ffffff" stroke-opacity=".72"/>
  <!-- Widget drawn in its real 186x44 px layout, scaled 1.6x like the rest of this mockup. -->
  <g transform="translate(13 175) scale(1.6)" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="700" text-anchor="middle">
    <g transform="translate(2 0)">
      <circle cx="5.5" cy="15.5" r="4.5" fill="#10a37f"/>
