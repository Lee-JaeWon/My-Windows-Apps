    </g>
    <g transform="translate(66 0)">
      <circle cx="5.5" cy="15.5" r="4.5" fill="#d97757"/>
      <text x="31.75" y="22.56" fill="#ef4444">15</text>
      <path d="M3.5 32.56H50.5" stroke="#7d8796" stroke-width="6" stroke-linecap="round"/>
      <path d="M3.5 32.56H10.55" stroke="#d97757" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(130 0)">
      <circle cx="5.5" cy="15.5" r="4.5" fill="#4285f4"/>
      <text x="31.75" y="22.56" fill="#17201b">100</text>
      <path d="M3.5 32.56H50.5" stroke="#4285f4" stroke-width="6" stroke-linecap="round"/>
